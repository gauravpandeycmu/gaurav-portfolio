<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dubrovnik survey fly-through</title><style>
*{box-sizing:border-box}body{margin:0;background:#e4eff2;color:#192d32;font:16px Arial;overflow:hidden}#scene{position:absolute;inset:0}canvas{display:block;width:100%;height:100%}.title{position:absolute;left:22px;top:20px;background:#faf8f4e8;border-radius:8px;padding:12px 16px;max-width:70%;pointer-events:none}.title strong{font-size:22px;display:block;color:#147d78}.title span{display:block;font-size:14px;margin-top:6px;color:#637276}#labels{position:absolute;inset:0;pointer-events:none}.label{position:absolute;border-radius:5px;background:#faf8f4ed;box-shadow:0 3px 15px #192d3220;padding:6px 9px;font-size:12px;white-space:nowrap;transform:translate(-50%,-100%);border-left:3px solid #8263ac}.label strong{font-size:14px;display:block;color:#147d78;margin-bottom:3px}.controls{position:absolute;bottom:12px;left:16px;right:16px;display:flex;gap:12px;align-items:center;background:#faf8f4ed;border-radius:8px;padding:10px 13px;font-size:13px}.controls button{border:1px solid #d1d9d6;border-radius:5px;background:#e3eeea;padding:6px 11px;color:#147d78;cursor:pointer}.controls input{flex:1;accent-color:#147d78}#status{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:18px;background:#faf8f4;border-radius:8px;font-size:18px;max-width:80%}#status:empty{display:none}.attribution{position:absolute;bottom:70px;right:15px;color:#435f66;font-size:11px;background:#faf8f4de;border-radius:4px;padding:5px 8px}
#fort-photo{display:none;position:absolute;right:18px;top:112px;width:320px;margin:0;background:#faf8f4ed;border-radius:8px;padding:9px;box-shadow:0 8px 25px #192d3220}#fort-photo img{display:block;width:302px;height:81px;object-fit:contain;border-radius:4px}#fort-photo figcaption{font-size:12px;color:#147d78;margin-top:7px}
.tour-steps{position:absolute;right:22px;top:24px;display:flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.4px;background:#faf8f4dc;padding:9px;border-radius:30px;pointer-events:none}.tour-steps span{padding:6px 8px;border-radius:20px;color:#70817a;transition:background .3s,color .3s}.tour-steps span.active{background:#147d78;color:white;box-shadow:0 3px 14px #147d7833}.tour-steps i{font-style:normal;color:#8c9d94}.tour-compass{position:absolute;bottom:77px;left:26px;display:flex;align-items:center;gap:9px;color:#147d78;pointer-events:none}.tour-compass b{font-size:32px;font-weight:normal}.tour-compass span{font-size:10px;letter-spacing:2px}.label{border:1px solid #ffffffb0;border-left:3px solid #8263ac;box-shadow:0 5px 20px #147d7818;backdrop-filter:blur(8px)}
</style></head><body><div id="scene"></div><div id="labels"></div><div class="title"><strong id="chapter">Loading the survey tour…</strong><span id="caption">Camera 1, GeoOrigin and surveyed BXR points</span></div><div id="status">Loading venue outlines</div><figure id="fort-photo"><img src="media/fort-race-detail.jpg" alt="Actual fort and city sector from the race camera"><figcaption>The same sector in the race recording · 190 s</figcaption></figure><div class="attribution" id="visual-source">Image-derived dashed outlines · illustrative diagram · ENU metres</div><div class="controls"><button id="play">Pause</button><button id="replay">Replay</button><button id="mode">Photo view</button><input id="seek" aria-label="Survey flight time" type="range" min="0" max="24" step="0.1" value="0"><span id="time">0 / 24 s</span></div><script type="module" src="flythrough.js"></script></body></html>
